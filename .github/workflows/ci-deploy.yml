name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  # Manually redeploy to GitHub Pages (from main).
  workflow_dispatch:

# Read-only by default; the deploy job requests the id-token itself.
permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Store dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Azure Storage
    needs: build
    # Only on main, and only if the Azure storage account is configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_STORAGE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # No two deploys at the same time to the same container.
    concurrency:
      group: deploy-azure-storage
      cancel-in-progress: false
    env:
      STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # First everything with a hash in the name (assets, icons, workbox): those already exist
      # when the new index.html goes live.
      - name: Upload static files to $web
        run: |
          set -euo pipefail
          mkdir stage
          cp -R dist/. stage/
          for f in index.html sw.js share-target-sw.js registerSW.js manifest.webmanifest; do
            rm -f "stage/$f"
          done
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login \
            -d '$web' \
            -s stage \
            --overwrite

      # Then the files that must always be fetched fresh (PWA updates), with no-cache set
      # directly on upload, so there is no moment with heuristic caching.
      # index.html goes live last.
      - name: Upload index, service worker and manifest (no-cache)
        run: |
          set -euo pipefail
          for entry in \
            "manifest.webmanifest|application/manifest+json" \
            "registerSW.js|application/javascript" \
            "share-target-sw.js|application/javascript" \
            "sw.js|application/javascript" \
            "index.html|text/html; charset=utf-8"; do
            name="${entry%%|*}"
            type="${entry#*|}"
            if [ ! -f "dist/$name" ]; then
              echo "dist/$name does not exist; skipped."
              continue
            fi
            az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --auth-mode login \
              --container-name '$web' \
              --name "$name" \
              --file "dist/$name" \
              --content-type "$type" \
              --content-cache-control "no-cache" \
              --overwrite
          done

  pages:
    name: Deploy to GitHub Pages
    needs: build
    # Only from main: on a push or started manually.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # No two Pages deploys at the same time; a running deploy is completed.
    concurrency:
      group: deploy-github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The app uses relative paths (base './') and HashRouter, so it works
      # without changes under https://<owner>.github.io/dress-kid/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
