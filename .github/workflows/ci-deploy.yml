name: CI en deploy

on:
  pull_request:
  push:
    branches: [main]

# Standaard alleen lezen; de deploy-job vraagt zelf id-token aan.
permissions:
  contents: read

jobs:
  build:
    name: Controleren en bouwen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: dist als artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deployen naar Azure Storage
    needs: build
    # Alleen op main, en alleen als het Azure-opslagaccount is ingesteld.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_STORAGE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Geen twee deploys tegelijk naar dezelfde container.
    concurrency:
      group: deploy-azure-storage
      cancel-in-progress: false
    env:
      STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Inloggen bij Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Eerst alles met een hash in de naam (assets, iconen, workbox): die bestaan dan al
      # wanneer de nieuwe index.html live gaat.
      - name: Statische bestanden uploaden naar $web
        run: |
          set -euo pipefail
          mkdir stage
          cp -R dist/. stage/
          for f in index.html sw.js registerSW.js manifest.webmanifest; do
            rm -f "stage/$f"
          done
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login \
            -d '$web' \
            -s stage \
            --overwrite

      # Daarna de bestanden die altijd vers opgehaald moeten worden (PWA-updates), met
      # no-cache direct bij het uploaden, zodat er geen moment is met heuristische caching.
      # index.html gaat als laatste live.
      - name: Index, service worker en manifest uploaden (no-cache)
        run: |
          set -euo pipefail
          for entry in \
            "manifest.webmanifest|application/manifest+json" \
            "registerSW.js|application/javascript" \
            "sw.js|application/javascript" \
            "index.html|text/html; charset=utf-8"; do
            name="${entry%%|*}"
            type="${entry#*|}"
            if [ ! -f "dist/$name" ]; then
              echo "dist/$name bestaat niet; overgeslagen."
              continue
            fi
            az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --auth-mode login \
              --container-name '$web' \
              --name "$name" \
              --file "dist/$name" \
              --content-type "$type" \
              --content-cache-control "no-cache" \
              --overwrite
          done
